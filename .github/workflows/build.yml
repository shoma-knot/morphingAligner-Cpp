# Ubuntu と Windows で本体をビルドし、配布物をまとめて中身を検査する（再利用ワークフロー）。
# release.yml（タグ push 時のリリース）と ci.yml（push ごとのビルド確認・テスト）から呼ぶ。
#
# 配布物の構成（font/ と licenses/ を実行時に相対パスで開くため、この形を崩さないこと）:
#
#   morphingAligner-<版>-<環境>/
#     morphingAlignerCpp(.exe)   ← 直下に置く。作業ディレクトリがここになるので
#     font/ licenses/              "font/..." がそのまま当たる
#     README.md
#     python/                    ← 音声解析（フォルマント・音素アライメント）のスクリプトと環境定義
#     install-win.bat            ← Windows のみ。音声解析の Python 環境（.env）を作る
#     install.sh                 ← Linux のみ。同上
#     icon/ tools/               ← Linux のみ。デスクトップエントリ登録に使う
name: build

on:
  workflow_call:
    inputs:
      with_tests:
        description: コアの単体テストを作って実行し、speech_tools の結合テストも作ってアーティファクトとして上げる
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            triplet: x64-linux
            extra_cmake: ""
          - name: windows-x64
            os: windows-latest
            # 静的トリプレットにして、再頒布可能パッケージや DLL を同梱せずに済ませる。
            triplet: x64-windows-static
            # x64-windows-static は静的 CRT なので、本体側もそれに合わせる。
            extra_cmake: "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"

    env:
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache

    steps:
      - name: チェックアウト（WORLD はサブモジュール）
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: タグとアプリの版が一致しているか見る
        # タイトルバーに出る版は project() の VERSION と APP_VERSION_SUFFIX（".a" など）
        # から来る。食い違ったまま公開すると、v0.2.0 のリリースなのにアプリが v0.1.0 と
        # 名乗ることになる。タグから起動されたときだけ見る。"-rc1" などの接尾辞は許す。
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -eu
          PROJ_VER=$(sed -n 's/^project(.*VERSION \([0-9][0-9.]*\).*/\1/p' CMakeLists.txt)
          SUFFIX=$(sed -n 's/^set(APP_VERSION_SUFFIX "\([^"]*\)").*/\1/p' CMakeLists.txt)
          APP_VER="$PROJ_VER$SUFFIX"
          echo "CMakeLists.txt: $APP_VER / タグ: $GITHUB_REF_NAME"
          case "$GITHUB_REF_NAME" in
            "v$APP_VER" | "v$APP_VER-"*) ;;
            *)
              echo "タグとアプリの版（project() の VERSION + APP_VERSION_SUFFIX）が食い違っています。" >&2
              echo "CMakeLists.txt を更新してからタグを打ち直してください。" >&2
              exit 1
              ;;
          esac

      - name: Linux のビルド依存を入れる
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xorg-dev libxinerama-dev libxcursor-dev libglu1-mesa-dev \
            libasound2-dev pkg-config

      - name: CMake と Ninja を入れる
        # ランナー同梱の CMake は 3.x のことがあり、cmake_minimum_required(VERSION 4.0)
        # を満たさないため明示的に導入する。Ninja も一緒に入る。
        uses: lukka/get-cmake@latest

      - name: MSVC の環境を用意する
        # Ninja（単一構成ジェネレータ）を Linux と揃えて使うため、cl.exe への
        # パスと環境変数をここで通す。Visual Studio ジェネレータだと出力先が
        # bin/Release/ になり、後段の取り回しが環境ごとに変わってしまう。
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: vcpkg のバイナリキャッシュを復元する
        uses: actions/cache@v6
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-${{ matrix.name }}-

      - name: 構成
        shell: bash
        run: |
          set -eux
          # vcpkg はキャッシュ先が存在しないと失敗する。
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DMORPHALIGNER_BUILD_TESTS=${{ inputs.with_tests && 'ON' || 'OFF' }} \
            ${{ matrix.extra_cmake }}

      - name: ビルド
        shell: bash
        run: cmake --build build

      - name: 単体テスト（コア）
        # GUI に依存しない部分（アンカー整形・自動生成・移動平均・セッション JSON）。
        # Python 環境は要らないので、ビルドしたその場で実行する。
        if: inputs.with_tests
        shell: bash
        run: ./bin/core_test

      - name: 配布物をまとめる
        id: package
        shell: bash
        run: |
          set -eux
          # タグから起動されたときはタグ名を版とする。それ以外（CI）は短縮ハッシュ。
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="$(git rev-parse --short HEAD)"
          fi
          DIR="morphingAligner-${VERSION}-${{ matrix.name }}"

          mkdir -p "$DIR"
          # 実行ファイルは配布物の直下に置く。ここから起動すれば作業ディレクトリが
          # 配布ルートになり、font/ と licenses/ が相対パスで素直に見つかる。
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp bin/morphingAlignerCpp.exe "$DIR"/
          else
            cp bin/morphingAlignerCpp "$DIR"/
          fi
          # python/ は音声解析のスクリプトと環境定義。実行に使う Python 環境（.env）は同梱せず、
          # 使う人がインストールスクリプト（install-win.bat / install.sh）で配布ルートに作る。
          cp -r font licenses python README.md "$DIR"/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp install-win.bat "$DIR"/
          else
            cp install.sh "$DIR"/
            chmod +x "$DIR/install.sh"
            # デスクトップエントリの登録スクリプトとアイコン（Windows はアイコンを実行ファイルに
            # 埋め込んでいるので不要）。
            cp -r icon "$DIR"/
            mkdir -p "$DIR/tools"
            cp tools/install-desktop-entry.sh tools/uninstall-desktop-entry.sh "$DIR/tools/"
          fi

          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "${DIR}.zip" "$DIR" > /dev/null
            echo "archive=${DIR}.zip" >> "$GITHUB_OUTPUT"
          else
            tar -czf "${DIR}.tar.gz" "$DIR"
            echo "archive=${DIR}.tar.gz" >> "$GITHUB_OUTPUT"
          fi
          echo "dir=${DIR}" >> "$GITHUB_OUTPUT"

      - name: 配布物の中身を検査する
        shell: bash
        run: |
          set -eu
          DIR="${{ steps.package.outputs.dir }}"
          # 実行時に開くファイルが揃っているか。欠けていると日本語が化けたり
          # ライセンス表示が空になったりするが、起動自体はしてしまうので明示的に見る。
          for f in "font/Gen Interface JP/GenInterfaceJP-Regular.ttf" \
                   "font/Gen Interface JP/OFL.txt" \
                   "licenses/imgui.txt" "licenses/implot.txt" \
                   "licenses/nlohmann-json.txt" "licenses/world.txt" \
                   "licenses/tcmorph.txt" "licenses/eigen.txt" \
                   "README.md" \
                   "python/speech_tools.py" "python/environment.yml"; do
            test -f "$DIR/$f" || { echo "配布物に不足: $f" >&2; exit 1; }
          done
          if [ "$RUNNER_OS" = "Windows" ]; then
            test -f "$DIR/morphingAlignerCpp.exe" || { echo "実行ファイルがない" >&2; exit 1; }
            test -f "$DIR/install-win.bat" || { echo "install-win.bat がない" >&2; exit 1; }
            test -f "$DIR/python/install-env.ps1" || { echo "install-env.ps1 がない" >&2; exit 1; }
          else
            test -x "$DIR/morphingAlignerCpp" || { echo "実行ファイルがない" >&2; exit 1; }
            test -x "$DIR/install.sh" || { echo "install.sh がない（または実行権限がない）" >&2; exit 1; }
            # 動的リンクの取りこぼしがないか（未解決があれば "not found" が出る）。
            ldd "$DIR/morphingAlignerCpp" | (! grep "not found")
          fi
          echo "--- 構成 ---"
          find "$DIR" -type f | sort

      - name: アーティファクトとして上げる
        uses: actions/upload-artifact@v7
        with:
          name: morphingAligner-${{ matrix.name }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error

      - name: 結合テストの実行ファイルを上げる
        if: inputs.with_tests
        uses: actions/upload-artifact@v7
        with:
          name: speech-tools-test-${{ matrix.name }}
          path: bin/speech_tools_test*
          if-no-files-found: error
