# タグを push したときに Ubuntu と Windows の配布物をビルドし（build.yml）、
# GitHub のリリースとして公開する。配布物の構成は build.yml の先頭を参照。
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  release:
    name: リリースを作る
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # リリースの作成と資材の添付に要る。
      contents: write
    steps:
      - name: 両環境の配布物を集める
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: morphingAligner-*
          merge-multiple: true

      - name: リリースを作成して添付する
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          ls -l dist
          # 同じタグで再実行されたときに落ちないよう、既にあれば差し替えにする。
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
